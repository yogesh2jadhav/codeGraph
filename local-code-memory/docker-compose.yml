# Infrastructure only. The code-memory application and Ollama run on the host.
# Start with:  docker compose up -d
services:
  neo4j:
    image: neo4j:5.24-community
    container_name: code-memory-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # HTTP browser
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/neo4j"          # change via config/application.local.yaml
      NEO4J_server_memory_pagecache_size: "512M"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: code-memory-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  neo4j-data:
  neo4j-logs:
  qdrant-data:
